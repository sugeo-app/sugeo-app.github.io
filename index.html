<title>분리배출 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 칸짜리 검색 도구. 입력(글/사진) → 부품별 결과 카드 → 최근·자주 묻는 물건 */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#1d2420; --muted:#5d6a62; --line:#d9dfd8;
  --accent:#1f6b4f; --accent-fg:#ffffff; --warn:#b4471f;
  --plastic:#2f6fb0; --vinyl:#5a5fc0; --paper:#9a6b2f; --pack:#b08a2a; --can:#6b6f78; --glass:#2a8a7f; --food:#c0612b; --general:#4a4a4a; --special:#9b3f8c;
  --bin-fg:#ffffff;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1d2521; --fg:#e8eee9; --muted:#9aa89f; --line:#2f3a34;
  --accent:#5cc79a; --accent-fg:#0f1a14; --warn:#f0946b;
  --plastic:#6aa6e6; --vinyl:#9a9ef0; --paper:#d4a466; --pack:#e0c060; --can:#a8adb8; --glass:#5fc7ba; --food:#ec9361; --general:#b5b5b5; --special:#d585c6;
  --bin-fg:#111611; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --fg:#e8eee9; --muted:#9aa89f; --line:#2f3a34;
  --accent:#5cc79a; --accent-fg:#0f1a14; --warn:#f0946b;
  --plastic:#6aa6e6; --vinyl:#9a9ef0; --paper:#d4a466; --pack:#e0c060; --can:#a8adb8; --glass:#5fc7ba; --food:#ec9361; --general:#b5b5b5; --special:#d585c6;
  --bin-fg:#111611; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,2.6rem);line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted)}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button,.cam{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px}
.cam{background:var(--surface);color:var(--fg);border:2px solid var(--line);padding:0 14px}
.cam:hover{border-color:var(--accent)}
.cam svg{width:22px;height:22px}
#photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#photo:focus-visible + .cam,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
.preview{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.preview img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.preview button{min-height:32px;padding:0 10px;font-size:.85rem;background:transparent;color:var(--muted);border:1px solid var(--line)}
.label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:34px;font-weight:500;font-size:.9rem;padding:0 12px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item{font-size:1.35rem;font-weight:700;margin:0}
.count{font-size:.9rem;color:var(--muted)}
.tag{font-size:.72rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;letter-spacing:.04em}
.src{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.parts{display:flex;flex-direction:column;gap:0}
.part{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-top:1px dashed var(--line)}
.part:first-child{border-top:0;padding-top:0}
.part:last-child{padding-bottom:0}
.dot{grid-row:span 2;width:12px;height:12px;border-radius:50%;margin-top:8px;background:var(--c)}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pname{font-weight:700}
.bin{font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px;color:var(--bin-fg);background:var(--c)}
ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;color:var(--fg);min-width:0}
.tip{margin:0;padding:10px 14px;border-radius:8px;background:var(--bg);font-size:.92rem;color:var(--muted)}
.tip b{color:var(--fg)}
.more{align-self:flex-start;min-height:38px;padding:0 14px;font-size:.88rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.status{margin:0;color:var(--muted);display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.err{color:var(--warn);margin:0}
.foot{font-size:.8rem;color:var(--muted);margin:0}
</style>

<div class="wrap">
  <header>
    <h1>이거 어디에 버려?</h1>
    <p class="lead">물건 이름을 쓰면 안에 든 꼬마 AI가 바로 알려줘. 인터넷 없어도 돼.</p>
  </header>

  <div>
    <form id="f">
      <label for="q" hidden>버릴 물건</label>
      <input type="text" id="q" placeholder="예: 컵라면 용기, 치킨 뼈, 아이스팩" autocomplete="off" maxlength="80">
      <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      <label for="photo" class="cam" id="camBtn" hidden title="사진으로 물어보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </label>
      <button id="go" type="submit">찾기</button>
    </form>
  </div>
  <div class="preview" id="preview" hidden>
    <img id="thumb" alt="고른 사진">
    <span>사진 같이 보낼게</span>
    <button type="button" id="clearPhoto">빼기</button>
  </div>

  <section class="result" id="out" aria-live="polite"></section>

  <div id="recentBox" hidden>
    <p class="label">최근에 찾은 것</p>
    <div class="chips" id="recent"></div>
  </div>
  <div>
    <p class="label">헷갈리는 것들</p>
    <div class="chips" id="chips"></div>
  </div>

  <p class="foot">한국 환경부 분리배출 기준이야. 배출 요일이나 세부 규칙은 사는 구·아파트마다 다를 수 있어.</p>
</div>

const BINS={"플라스틱":"--plastic","비닐":"--vinyl","종이":"--paper","종이팩":"--pack","캔·고철":"--can","유리병":"--glass","음식물":"--food","일반쓰레기":"--general","대형·특수":"--special"};

// 재질 단어로 추측 (사전에 없을 때)
const GUESS=[
  [/배터리|건전지|형광등|충전|전자|전기|가전|폰|약/,"대형·특수",["따로 수거하는 품목일 수 있어","주민센터나 구청에 확인하기"]],
  [/유리|글라스/,"유리병",["병이면 비우고 헹궈서 유리병으로","컵·그릇이면 신문지에 싸서 일반쓰레기로"]],
  [/캔|알루미늄|철|스텐|스테인리스|금속|쇠|구리/,"캔·고철",["비우고 헹구기","고철로 배출"]],
  [/비닐|봉지|봉투|랩|필름|포장지/,"비닐",["이물질 털고 비닐류로"]],
  [/팩/,"종이팩",["헹궈서 펼쳐 말리기","종이팩 수거함에"]],
  [/종이|박스|상자|책|노트|신문|카드/,"종이",["테이프·비닐 떼기","납작하게 묶어서 종이류로"]],
  [/플라스틱|페트|용기|통|컵|뚜껑|트레이/,"플라스틱",["내용물 비우고 헹구기","플라스틱으로"]],
  [/껍질|껍데기|뼈|씨|가시/,"일반쓰레기",["딱딱하면 일반쓰레기","부드러운 과일 껍질이면 음식물"]],
  [/음식|반찬|과일|채소|야채|고기|생선|국물|소스/,"음식물",["물기 빼고 음식물로"]],
];

const norm=s=>s.toLowerCase().replace(/[\s·.,!?~'"()\-]/g,"").replace(/(을|를|은|는|이|가)?(어디에?|어떻게)?(버려|버리나요|버려요|버리지|버릴까)?$/,"");
const grams=s=>{const g=[];if(s.length<2)return[s];for(let i=0;i<s.length-1;i++)g.push(s.slice(i,i+2));return g};
function dice(a,b){const A=grams(a),B=grams(b).slice(),total=A.length+B.length;let m=0;A.forEach(x=>{const k=B.indexOf(x);if(k>=0){m++;B.splice(k,1)}});return 2*m/total}
function sim(q,a){
  let s=dice(q,a);
  if(a.length>=2&&q.includes(a)) s=Math.max(s,.62+.38*a.length/q.length);
  if(q.length>=2&&a.includes(q)) s=Math.max(s,.62+.38*q.length/a.length);
  return s;
}
const INDEX=DB.map(d=>({d,keys:d.n.map(norm)}));
function miniAI(text){
  const q=norm(text); if(!q) return null;
  let best=null,score=0;
  for(const e of INDEX) for(const k of e.keys){const s=sim(q,k);if(s>score){score=s;best=e.d}}
  if(score>=.8) return {...best,conf:"high"};
  if(score>=.5) return {...best,conf:"mid"};
  for(const [re,bin,steps] of GUESS) if(re.test(text)) return {item:text.trim(),parts:[{name:"",bin,steps}],tip:"사전에 없는 물건이라 이름만 보고 추측했어. 확실하지 않으면 구청에 확인해 봐.",conf:"guess"};
  return null;
}

/* ================================================================ */
const EXAMPLES=["치킨 먹고 남은 거","컵라면 용기","택배 상자","깨진 유리컵","보조배터리","우유팩","영수증","아이스팩","계란 껍데기","마라탕 용기","남은 약","티백"];
const $=s=>document.querySelector(s), out=$("#out"), btn=$("#go"), q=$("#q"), photo=$("#photo");
let sample=null, picked=null, ctl=null;

function loadRecent(){try{return JSON.parse(localStorage.getItem("recent")||"[]")}catch{return[]}}
function saveRecent(name){
  const list=[name,...loadRecent().filter(x=>x!==name)].slice(0,6);
  try{localStorage.setItem("recent",JSON.stringify(list))}catch{}
  drawRecent();
}
function drawRecent(){
  const list=loadRecent(), box=$("#recent"); box.innerHTML="";
  $("#recentBox").hidden=!list.length;
  list.forEach(x=>box.append(chip(x)));
}
function chip(x){const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=x;c.onclick=()=>{q.value=x;clearPhoto();ask()};return c}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const SRC={high:["꼬마 AI","--accent"],mid:["꼬마 AI · 아마 이거야","--pack"],guess:["꼬마 AI · 추측","--warn"],big:["Claude","--plastic"],example:["예시","--line"]};
function render(r,src,query){
  out.innerHTML="";
  const parts=Array.isArray(r.parts)?r.parts:[];
  const top=el("div","top");
  top.append(el("p","item",r.item||"물건"));
  const bins=new Set(parts.map(p=>p.bin));
  if(parts.length>1) top.append(el("span","count",bins.size>1?`${bins.size}군데로 나눠서 버려`:"한 곳에 버려도 돼"));
  const [label,color]=SRC[src]||SRC.high;
  const s=el("span","src");const dot=el("i");dot.style.setProperty("--c",`var(${color})`);s.append(dot,document.createTextNode(label));top.append(s);
  out.append(top);
  const list=el("div","parts");
  parts.forEach(p=>{
    const c=`var(${BINS[p.bin]||"--general"})`;
    const row=el("div","part");
    const d=el("span","dot"); d.style.setProperty("--c",c);
    const ph=el("div","ph");
    if(parts.length>1&&p.name) ph.append(el("span","pname",p.name));
    const b=el("span","bin",p.bin||"일반쓰레기"); b.style.setProperty("--c",c); ph.append(b);
    const ol=el("ol"); (p.steps||[]).forEach(x=>ol.append(el("li",null,x)));
    row.append(d,ph,ol); list.append(row);
  });
  out.append(list);
  if(r.tip){const t=el("p","tip");t.append(el("b",null,"알아두기 "),document.createTextNode(r.tip));out.append(t)}
  if(sample&&query&&src!=="big"&&src!=="example"){
    const m=el("button","more","Claude한테 더 자세히 물어보기");m.type="button";m.onclick=()=>askBig(query);out.append(m);
  }
}
function status(t){out.innerHTML="";const p=el("p","status");p.append(el("span","spin"),document.createTextNode(t));out.append(p)}
function msg(t){out.innerHTML="";out.append(el("p","err",t))}

/* ---------- 순서: 꼬마 AI 먼저 → 모르면 Claude ---------- */
function ask(){
  const item=q.value.trim();
  if(picked){askBig(item);return}
  if(!item){q.focus();return}
  const r=miniAI(item);
  if(r&&r.conf!=="guess"){render(r,r.conf,item);saveRecent(r.item);return}
  if(sample){askBig(item,r);return}
  if(r){render(r,"guess",item);return}
  msg("꼬마 AI가 모르는 물건이야. 다르게 불러보거나(예: '플라스틱 통') 구청에 확인해 봐.");
}

const PROMPT=item=>`너는 한국 분리배출 도우미야. ${item?`물건: "${item}"`:"사진 속 물건을 보고 판단해."}
한국 환경부 분리배출 기준으로, 재질이 다른 부품이 있으면 부품별로 나눠서 답해(최대 4개). 반말로 짧게.
bin은 반드시 이 중 하나: 플라스틱, 비닐, 종이, 종이팩, 캔·고철, 유리병, 음식물, 일반쓰레기, 대형·특수
(대형·특수 = 폐건전지, 보조배터리, 형광등, 폐의약품, 대형폐기물, 의류수거함 등 따로 수거하는 것)
JSON만 출력:
{"item":"물건 이름","parts":[{"name":"부품 이름","bin":"...","steps":["단계 1~3개, 각 한 줄"]}],"tip":"헷갈리기 쉬운 점 한 문장, 없으면 빈 문자열"}
쓰레기가 아니거나 판단이 안 되면 parts에 가장 가능성 높은 답을 넣고 tip에 구청이나 관리사무소에 확인하라고 써.`;

async function askBig(item,fallback){
  ctl?.abort(); ctl=new AbortController();
  btn.disabled=true; status(picked?"사진 보는 중…":"꼬마 AI가 몰라서 Claude한테 묻는 중…");
  try{
    const opts={modelTier:picked?"default":"quick",signal:ctl.signal};
    if(picked) opts.images=[picked];
    const r=await sample.json(PROMPT(item),opts);
    if(!r||!Array.isArray(r.parts)||!r.parts.length) throw {code:"invalid_json"};
    render(r,"big",item);
    saveRecent(r.item||item);
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled") return;
    if(fallback){render(fallback,"guess",item);return}
    if(c==="not_granted"||c==="sampling_disabled") msg("Claude 사용 허락이 필요해. 페이지 권한에서 허용하면 쓸 수 있어.");
    else if(c==="rate_limited") msg("요청이 많아. 조금 있다가 다시 해줘.");
    else if(c==="image_rejected") msg("이 사진은 못 읽었어. 다른 사진(JPG, PNG)으로 해줘.");
    else if(c==="images_unavailable"){$("#camBtn").hidden=true;clearPhoto();msg("여기선 사진을 못 보내. 이름으로 써줘.")}
    else msg("답을 못 받았어. 물건 이름을 조금 다르게 써서 다시 해봐.");
  }finally{btn.disabled=false}
}

function clearPhoto(){picked=null;photo.value="";$("#preview").hidden=true}
photo.addEventListener("change",()=>{
  const f=photo.files&&photo.files[0]; if(!f) return;
  picked=f; $("#thumb").src=URL.createObjectURL(f); $("#preview").hidden=false;
  if(!q.value.trim()) ask();
});
$("#clearPhoto").onclick=clearPhoto;

$("#f").addEventListener("submit",e=>{e.preventDefault();ask()});
EXAMPLES.forEach(x=>$("#chips").append(chip(x)));
drawRecent();
render(miniAI("페트병"),"example");
(async()=>{
  sample=await window.claude?.use?.("sample");
  if(!sample) return;
  const lim=await sample.limits().catch(()=>null);
  if(lim&&lim.images){photo.hidden=false;$("#camBtn").hidden=false;photo.accept=lim.images.mediaTypes.join(",")}
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 못 찾았어 · 이거 어디에 버려?</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon-192.png">
<style>
@font-face{font-family:"Noto Sans KR";font-weight:400;font-display:swap;src:url("/fonts/noto-sans-kr-400.woff2") format("woff2")}
@font-face{font-family:"Noto Sans KR";font-weight:700;font-display:swap;src:url("/fonts/noto-sans-kr-700.woff2") format("woff2")}
@font-face{font-family:"Black Han Sans";font-display:swap;src:url("/fonts/black-han-sans.woff2") format("woff2")}
:root{--bg:#f3f5f1;--fg:#1d2420;--muted:#5d6a62;--accent:#1f6b4f;--accent-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--fg:#e8eee9;--muted:#9aa89f;--accent:#5cc79a;--accent-fg:#0f1a14;color-scheme:dark}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all;padding:24px;box-sizing:border-box}
main{max-width:420px;display:flex;flex-direction:column;gap:14px}
.e{font-size:4rem;margin:0}
h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:2.2rem;margin:0}
p{margin:0;color:var(--muted);line-height:1.6}
a{align-self:flex-start;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="e">🗑️</p>
  <h1>이 페이지는 이미 버려졌어</h1>
  <p>주소가 틀렸거나 없어진 페이지야. 처음 화면으로 돌아가서 버릴 물건을 찾아 봐.</p>
  <a href="/">처음 화면으로</a>
</main>
</body>
</html>
